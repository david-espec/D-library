name: Gerar o APK do D Libery

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write para publicar o APK numa Release, com link fixo de download.
permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependencias, analise e testes
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Chave de assinatura: o Android so instala uma versao nova por cima da
      # antiga (sem apagar os livros) se a chave for sempre a mesma.
      #  1. Preferida: segredos DLIBERY_KEYSTORE_BASE64 e DLIBERY_KEYSTORE_PASSWORD.
      #  2. Sem eles: chave gerada na primeira build e guardada no cache do Actions.
      - name: Restaurar chave do cache
        uses: actions/cache@v4
        with:
          path: ~/.dlibery-keystore
          key: dlibery-keystore-v1

      - name: Preparar chave
        env:
          KS_B64: ${{ secrets.DLIBERY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DLIBERY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Usando a chave dos segredos do repositorio"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dlibery.jks"
            echo "DLIBERY_KEYSTORE=$RUNNER_TEMP/dlibery.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_PASS"
            echo "DLIBERY_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            D="$HOME/.dlibery-keystore"
            mkdir -p "$D"
            if [ ! -f "$D/dlibery.jks" ]; then
              echo "Gerando chave nova (guardada no cache do Actions)"
              head -c 24 /dev/urandom | base64 | tr -d '/+=' > "$D/pass"
              keytool -genkeypair -keystore "$D/dlibery.jks" -alias dlibery -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" -dname "CN=D Libery, C=BR"
            fi
            echo "::add-mask::$(cat "$D/pass")"
            echo "DLIBERY_KEYSTORE=$D/dlibery.jks" >> "$GITHUB_ENV"
            echo "DLIBERY_KEYSTORE_PASSWORD=$(cat "$D/pass")" >> "$GITHUB_ENV"
          fi

      - name: Compilar o APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk D-Libery.apk
          ls -la D-Libery.apk
          # O app instalado le este arquivo para saber se ha versao nova.
          printf '{"versionCode": %s, "versionName": "1.0.%s", "sha256": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$(sha256sum D-Libery.apk | cut -d' ' -f1)" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: D-Libery-apk
          path: D-Libery.apk

      # Sempre o mesmo endereco para baixar a versao mais nova:
      # https://github.com/<dono>/<repo>/releases/download/apk/D-Libery.apk
      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="D Libery para Android — versão 1.0.${{ github.run_number }}.
          Baixe o D-Libery.apk abaixo no celular e toque nele para instalar."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk D-Libery.apk version.json --clobber
            gh release edit apk --notes "$notes"
          else
            gh release create apk D-Libery.apk version.json --target "${{ github.sha }}" \
              --title "D Libery — app para Android" --notes "$notes"
          fi
